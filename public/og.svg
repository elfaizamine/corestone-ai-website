<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CoreStone AI">
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="#F2F5F9"/>
  <rect x="0" y="0" width="1200" height="8" fill="#1C3D6E"/>
  <g transform="translate(90, 96)">
    <rect width="56" height="56" rx="13" fill="#1C3D6E"/>
    <text x="28" y="30" text-anchor="middle" dominant-baseline="central"
      font-family="'Inter Tight','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">CS</text>
    <text x="76" y="30" dominant-baseline="central"
