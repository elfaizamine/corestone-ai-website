# Netlify configuration for CoreStone AI
# Deploy: connect this repo in the Netlify dashboard, or run `netlify deploy --build`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Static 404 handling
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
